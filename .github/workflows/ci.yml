name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  dags:
    # Build the real Airflow image and check both DAG files load in it. A DAG that fails
    # to import simply vanishes from Airflow, so catch it here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rain-watch .
      - run: |
          docker run --rm -v "$PWD/dags:/opt/airflow/dags" -e PYTHONPATH=/opt/rain-watch/src \
            --entrypoint python rain-watch -c "
          from airflow.models.dagbag import DagBag
          bag = DagBag('/opt/airflow/dags')
          assert not bag.import_errors, bag.import_errors
          assert set(bag.dag_ids) == {'rain_daily', 'rain_history'}, bag.dag_ids
          print('DAGs load:', sorted(bag.dag_ids))"
