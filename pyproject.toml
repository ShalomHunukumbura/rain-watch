[project]
name = "rain-watch"
version = "0.1.0"
description = "Daily rainfall for every Sri Lankan district, compared with what is normal"
readme = "README.md"
authors = [
    { name = "Shalom Hunukumbura", email = "shalom@xaventra.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
]

[project.scripts]
rain-watch = "rain_watch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
